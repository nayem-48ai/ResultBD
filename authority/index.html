<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="p-6 max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-white p-6 rounded-3xl shadow-sm border">
            <h1 class="text-2xl font-black text-slate-800">Results Manager</h1>
            <div class="flex gap-3">
                <button id="export-csv" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">Export CSV</button>
                <button id="export-json" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold">Export JSON</button>
            </div>
        </div>

        <div id="results-list" class="grid gap-4">
            </div>
    </div>

    <script type="module">
        import { db, collection, getDocs } from '../firebase-config.js';
        import { exportData } from '../components.js';

        let currentData = [];

        async function loadResults() {
            const snap = await getDocs(collection(db, "results"));
            const container = document.getElementById('results-list');
            container.innerHTML = '';
            
            snap.forEach(doc => {
                const res = doc.data();
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl shadow-sm border flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <h3 class="font-black text-slate-800">${res.examName} - ${res.className}</h3>
                        <p class="text-xs text-slate-400">Year: ${res.year} | Students: ${res.data.length}</p>
                    </div>
                    <button class="view-btn bg-slate-100 hover:bg-slate-200 p-2 rounded-lg" data-id="${doc.id}">
                        <i data-lucide="eye" class="w-5 h-5 text-slate-600"></i>
                    </button>
                `;
                container.appendChild(card);
                
                // এক্সপোর্টের জন্য ডাটা জমা রাখা
                card.querySelector('.view-btn').onclick = () => {
                    currentData = res.data;
                    alert("Data selected for " + res.examName + ". Use Export buttons above.");
                };
            });
            lucide.createIcons();
        }

        document.getElementById('export-csv').onclick = () => exportData(currentData, 'csv');
        document.getElementById('export-json').onclick = () => exportData(currentData, 'json');

        loadResults();
    </script>
</body>
</html>
