<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduResult - Search Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fcfcfd; margin: 0; }
        
        /* WebView Responsive Fix */
        #printable-area { width: 100%; display: flex; justify-content: center; padding: 1rem; }

        @media print {
            @page { size: A4; margin: 0; }
            html, body { 
                height: 297mm; 
                overflow: hidden; 
                background: white !important; 
            }
            body * { visibility: hidden !important; }
            #printable-area, #printable-area * { visibility: visible !important; }
            
            #printable-area { 
                position: absolute; 
                left: 0; 
                top: 0; 
                width: 210mm; 
                height: 297mm; 
                padding: 0;
                margin: 0;
                display: block;
            }
            .a4-container {
                width: 210mm !important;
                height: 297mm !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border-width: 6px !important; /* প্রফেশনাল লুকের জন্য */
            }
            .no-print { display: none !important; }
        }

        .fade-in { animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div id="nav-container"></div>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        <div id="search-section" class="fade-in no-print">
            <div class="text-center mb-12">
                <h1 class="text-4xl sm:text-6xl font-black text-slate-900 mb-4 tracking-tighter">Academic <span class="text-blue-600">Dashboard</span></h1>
                <p class="text-slate-500 max-w-xl mx-auto font-medium">Instantly access your examination performance data.</p>
            </div>

            <div class="grid lg:grid-cols-2 gap-10 items-center">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl border border-slate-100 space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Year</label>
                            <select id="year-select" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-sm appearance-none"></select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Class</label>
                            <select id="class-select" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-sm appearance-none"></select>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Exam</label>
                        <select id="exam-select" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold text-sm appearance-none"></select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Roll / ID</label>
                        <input type="text" id="roll-input" placeholder="Enter Roll" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none font-bold">
                    </div>
                    <button id="search-btn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="search" class="w-5 h-5"></i> FETCH MARKSHEET
                    </button>
                </div>
                <div class="hidden lg:block">
                    <img src="https://cdni.iconscout.com/illustration/premium/thumb/student-reading-book-illustration-download-in-svg-png-gif-file-formats--young-education-knowledge-study-pack-people-illustrations-5381831.png" class="w-full max-w-md mx-auto opacity-80">
                </div>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-6 fade-in">
            <div class="flex flex-col sm:flex-row justify-between items-center no-print gap-4">
                <button onclick="location.reload()" class="flex items-center gap-2 text-slate-500 hover:text-blue-600 font-black text-xs uppercase tracking-widest"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to search</button>
                <button onclick="window.print()" class="w-full sm:w-auto bg-green-600 text-white px-8 py-3 rounded-xl font-black text-xs uppercase tracking-widest shadow-lg hover:bg-green-700 flex items-center justify-center gap-2"><i data-lucide="printer" class="w-4 h-4"></i> PRINT A4 MARKSHEET</button>
            </div>
            <div id="printable-area"></div>
        </div>
    </main>

    <script type="module">
        import { auth, db, collection, getDocs, doc, getDoc, onAuthStateChanged, signOut } from './firebase-config.js';
        import { renderNavbar, renderMarksheet } from './components.js';

        onAuthStateChanged(auth, user => {
            document.getElementById('nav-container').innerHTML = '';
            document.getElementById('nav-container').appendChild(renderNavbar(user));
            lucide.createIcons();
            if(user) document.getElementById('nav-logout-btn').onclick = () => signOut(auth).then(() => location.reload());
        });

        const yS = document.getElementById('year-select'), cS = document.getElementById('class-select'), eS = document.getElementById('exam-select');
        getDocs(collection(db, "results")).then(snap => {
            const ySet = new Set(), cSet = new Set(), eSet = new Set();
            snap.forEach(d => { const data = d.data(); ySet.add(data.year); cSet.add(data.className); eSet.add(data.examName); });
            yS.innerHTML = '<option value="">Year</option>' + [...ySet].sort().reverse().map(i => `<option value="${i}">${i}</option>`).join('');
            cS.innerHTML = '<option value="">Class</option>' + [...cSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
            eS.innerHTML = '<option value="">Exam</option>' + [...eSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
        });

        document.getElementById('search-btn').onclick = async () => {
            const y = yS.value, c = cS.value, e = eS.value, roll = document.getElementById('roll-input').value;
            if(!y || !c || !e || !roll) return alert("Fill all fields");

            const snap = await getDoc(doc(db, "results", `${y}_${c}_${e}`));
            if(snap.exists()) {
                const results = snap.data();
                const found = results.data.find(r => String(r['Roll No'] || r['ID'] || r['Roll']).toLowerCase() === roll.toLowerCase());
                if(found) {
                    document.getElementById('search-section').classList.add('hidden');
                    document.getElementById('result-view').classList.remove('hidden');
                    document.getElementById('printable-area').innerHTML = renderMarksheet(found, results);
                    lucide.createIcons();
                } else alert("Roll not found");
            } else alert("No data found");
        };
    </script>
</body>
                                                                                                                    </html>
