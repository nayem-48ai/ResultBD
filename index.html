<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduResult - Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fcfcfd; }
        .glass-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); }
        
        @media print {
            @page { size: A4; margin: 0; }
            html, body { height: 100vh; overflow: hidden; background: white !important; }
            .no-print { display: none !important; }
            #printable-area { 
                display: block !important; 
                width: 210mm;
                height: 297mm;
                padding: 12mm;
                margin: 0;
            }
            .a4-container { 
                height: 100% !important; 
                border: 4px double #000 !important; 
                box-sizing: border-box !important;
                display: flex !important;
                flex-direction: column !important;
            }
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="nav-container"></div>
    <main class="container mx-auto px-4 py-12 max-w-5xl">
        <div id="search-section" class="no-print">
            <div class="text-center mb-16">
                <h1 class="text-5xl font-black text-slate-900 mb-4 tracking-tighter">Academic <span class="text-blue-600">Portal</span></h1>
                <p class="text-slate-500 font-medium">নিচে আপনার প্রয়োজনীয় তথ্য দিয়ে রেজাল্ট কার্ড সংগ্রহ করুন।</p>
            </div>
            <div class="glass-card p-10 rounded-[2.5rem] shadow-2xl max-w-lg mx-auto space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Session Year</label>
                        <select id="year-select" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold text-sm appearance-none"></select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Class</label>
                        <select id="class-select" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold text-sm appearance-none"></select>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Examination</label>
                    <select id="exam-select" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold text-sm appearance-none"></select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Roll / ID Number</label>
                    <input type="text" id="roll-input" placeholder="e.g. 102" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold">
                </div>
                <button id="search-btn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black hover:bg-slate-800 transition-all flex items-center justify-center gap-3">
                    <i data-lucide="file-text" class="w-6 h-6"></i> FETCH MARKSHEET
                </button>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-8">
            <div class="flex justify-between items-center no-print">
                <button onclick="location.reload()" class="text-slate-400 hover:text-blue-600 font-black text-xs uppercase flex items-center gap-2 transition-all"><i data-lucide="chevron-left"></i> Back</button>
                <button onclick="window.print()" class="bg-green-600 text-white px-8 py-3 rounded-2xl font-black text-xs uppercase shadow-xl hover:bg-green-700 active:scale-95 flex items-center gap-2 transition-all"><i data-lucide="printer" class="w-4 h-4"></i> PRINT PDF</button>
            </div>
            <div id="printable-area"></div>
        </div>
    </main>

    <script type="module">
        import { auth, db, collection, getDocs, doc, getDoc, onAuthStateChanged, signOut } from './firebase-config.js';
        import { renderNavbar, renderMarksheet } from './components.js';

        onAuthStateChanged(auth, user => {
            document.getElementById('nav-container').innerHTML = '';
            document.getElementById('nav-container').appendChild(renderNavbar(user));
            lucide.createIcons();
            if(user) {
                document.getElementById('nav-logout-btn').onclick = () => signOut(auth).then(() => location.reload());
            }
        });

        const yearsSet = new Set(), classesSet = new Set(), examsSet = new Set();
        getDocs(collection(db, "results")).then(snap => {
            snap.forEach(d => {
                const data = d.data();
                yearsSet.add(data.year); classesSet.add(data.className); examsSet.add(data.examName);
            });
            populate('year-select', [...yearsSet].sort().reverse());
            populate('class-select', [...classesSet].sort());
            populate('exam-select', [...examsSet].sort());
        });

        const populate = (id, items) => {
            document.getElementById(id).innerHTML = '<option value="">Select</option>' + items.map(i => `<option value="${i}">${i}</option>`).join('');
        };

        document.getElementById('search-btn').onclick = async () => {
            const y = document.getElementById('year-select').value, c = document.getElementById('class-select').value, e = document.getElementById('exam-select').value, roll = document.getElementById('roll-input').value;
            if(!y || !c || !e || !roll) return alert("All fields are mandatory.");

            const snap = await getDoc(doc(db, "results", `${y}_${c}_${e}`));
            if(snap.exists()) {
                const results = snap.data();
                const found = results.data.find(r => String(r['Roll No'] || r['ID'] || r['Roll'] || '').trim() === String(roll).trim());
                if(found) {
                    document.getElementById('search-section').classList.add('hidden');
                    document.getElementById('result-view').classList.remove('hidden');
                    document.getElementById('printable-area').innerHTML = renderMarksheet(found, results);
                    lucide.createIcons();
                } else alert("Roll not found.");
            } else alert("Result dataset not published.");
        };
    </script>
</body>
</html>
