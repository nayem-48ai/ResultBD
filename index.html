<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Result Portal</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co.com/HDqfKG6K/Seal-school.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        
        .result-sheet {
            background: white;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 30px;
        }

        @media print {
            @page { size: A4; margin: 5mm; }
            html, body { height: 99%; }
            body { background: white !important; margin: 0 !important; }
            .no-print { display: none !important; }
            .result-sheet { 
                padding: 10px !important;
                width: 100% !important;
                max-width: 100% !important;
                box-shadow: none !important;
            }
            .print-bg-dark { background-color: #000 !important; color: #fff !important; -webkit-print-color-adjust: exact; }
        }

        .captcha-box {
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* মোবাইল ফুটারের জন্য কাস্টম রেসপন্সিভ স্টাইল */
        @media (max-width: 640px) {
            .footer-text { font-size: 9px !important; }
            .footer-sign { height: 16px !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-white border-b no-print py-3 shadow-sm">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-2 font-extrabold text-xl tracking-tighter">
                <div class="bg-blue-600 p-1.5 rounded text-white"><i data-lucide="graduation-cap"></i></div>
                EduResult
            </div>
            <div class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Name of a Institute</div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-6">
        <div id="search-section" class="no-print max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-xl font-black mb-6 text-center uppercase tracking-tight">Student Result Search</h2>
            
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <select id="year-select" class="p-3 bg-slate-50 border border-slate-200 rounded-lg font-semibold outline-none text-sm"></select>
                    <select id="class-select" class="p-3 bg-slate-50 border border-slate-200 rounded-lg font-semibold outline-none text-sm"></select>
                    <select id="exam-select" class="p-3 bg-slate-50 border border-slate-200 rounded-lg font-semibold outline-none text-sm"></select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="number" id="roll-input" placeholder="Enter Roll Number" class="p-3 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-sm outline-blue-500">
                    
                    <div class="captcha-box">
                        <span id="captcha-question" class="font-bold text-blue-600 tracking-wider"></span>
                        <input type="number" id="captcha-input" placeholder="?" class="w-16 p-1 text-center bg-white border border-slate-300 rounded font-bold outline-none">
                        <button onclick="generateCaptcha()" class="text-slate-400 hover:text-blue-500 transition-colors" title="Reload Equation">
                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button id="search-btn" class="w-full bg-slate-900 text-white py-3.5 rounded-xl font-bold hover:bg-blue-700 flex items-center justify-center gap-2 transition-all shadow-lg active:scale-[0.98]">
                    <i data-lucide="file-search" class="w-5 h-5"></i> VIEW RESULT
                </button>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-4">
            <div class="flex justify-between items-center no-print max-w-[850px] mx-auto px-2">
                <button onclick="location.reload()" class="text-slate-500 font-bold text-xs uppercase flex items-center gap-1"><i data-lucide="chevron-left" class="w-4 h-4"></i> Back to Search</button>
                <button onclick="window.print()" class="bg-green-600 text-white px-5 py-2 rounded-lg font-bold text-xs flex items-center gap-2 shadow-md"><i data-lucide="printer" class="w-4 h-4"></i> PRINT SHEET</button>
            </div>
            <div id="printable-area"></div>
        </div>
    </main>

    <footer id="main-footer" class="no-print bg-white border-t py-3">
        <div class="container mx-auto px-2">
            <div class="footer-text flex flex-row items-center justify-center gap-1.5 md:gap-2 text-slate-500 text-[11px] md:text-sm font-medium whitespace-nowrap">
                <span>© 2026 All Rights Reserved</span>
                <span class="text-slate-300">|</span>
                <span class="font-bold text-slate-700">Institution Name</span>
                <span class="text-slate-300">|</span>
                <div class="flex items-center gap-1">
                    <span>Developed by</span>
                    <img src="https://i.ibb.co.com/1C0fss2/Tarikul-sign.png" alt="Dev" class="footer-sign h-5 md:h-7 w-auto object-contain">
                </div>
            </div>
        </div>
    </footer>

    <script type="module">
        import { db, collection, getDocs, doc, getDoc } from './firebase-config.js';
        import { renderMarksheet } from './components.js';

        let captchaAnswer;

        window.generateCaptcha = function() {
            const num1 = Math.floor(Math.random() * 10);
            const num2 = Math.floor(Math.random() * 10);
            const isPlus = Math.random() > 0.5;
            
            if (isPlus) {
                captchaAnswer = num1 + num2;
                document.getElementById('captcha-question').innerText = `${num1} + ${num2} =`;
            } else {
                const max = Math.max(num1, num2);
                const min = Math.min(num1, num2);
                captchaAnswer = max - min;
                document.getElementById('captcha-question').innerText = `${max} - ${min} =`;
            }
            document.getElementById('captcha-input').value = "";
            lucide.createIcons();
        }

        lucide.createIcons();
        generateCaptcha();

        const yS = document.getElementById('year-select'), cS = document.getElementById('class-select'), eS = document.getElementById('exam-select');

        getDocs(collection(db, "results")).then(snap => {
            const ySet = new Set(), cSet = new Set(), eSet = new Set();
            snap.forEach(d => { const data = d.data(); ySet.add(data.year); cSet.add(data.className); eSet.add(data.examName); });
            yS.innerHTML = '<option value="">Year</option>' + [...ySet].sort().reverse().map(i => `<option value="${i}">${i}</option>`).join('');
            cS.innerHTML = '<option value="">Class</option>' + [...cSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
            eS.innerHTML = '<option value="">Exam</option>' + [...eSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
        });

        document.getElementById('search-btn').onclick = async () => {
            const roll = document.getElementById('roll-input').value;
            const userAnswer = parseInt(document.getElementById('captcha-input').value);
            const docId = `${yS.value}_${cS.value}_${eS.value}`;

            if(!yS.value || !roll) return alert("Please select all fields!");
            if(isNaN(userAnswer)) return alert("Please solve the math equation!");
            if(userAnswer !== captchaAnswer) {
                alert("Security equation failed! Please try again.");
                generateCaptcha();
                return;
            }

            const snap = await getDoc(doc(db, "results", docId));
            if(snap.exists()) {
                const results = snap.data();
                const found = results.data.find(r => String(r['Roll No'] || r['Roll'] || r['ID']).trim().toLowerCase() === roll.trim().toLowerCase());
                if(found) {
                    document.getElementById('search-section').classList.add('hidden');
                    document.getElementById('main-footer').classList.add('hidden');
                    document.getElementById('result-view').classList.remove('hidden');
                    document.getElementById('printable-area').innerHTML = renderMarksheet(found, results);
                    lucide.createIcons();
                } else alert("Roll number not found!");
            } else alert("Database error!");
        };
    </script>
</body>
</html>
