<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduResult - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; }
        
        /* Mobile View Auto-Fit Logic */
        #printable-area { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            padding: 20px 0;
            overflow: hidden;
        }

        .a4-container {
            width: 210mm;
            height: 297mm;
            background: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform-origin: top center;
            border: 6px double #000;
        }

        @media (max-width: 800px) {
            /* মোবাইলে স্ক্রিন অনুযায়ী অটো ছোট হবে */
            #printable-area { height: 100vh; align-items: center; padding: 0; }
            .a4-container {
                transform: scale(calc(100vw / 230mm)); /* স্ক্রিন অনুযায়ী স্কেলিং */
                box-shadow: none;
            }
            #result-view { margin-top: 0; }
        }

        @media print {
            @page { size: A4; margin: 0; }
            body { background: white !important; overflow: visible !important; }
            body * { visibility: hidden !important; }
            #printable-area, #printable-area * { visibility: visible !important; }
            #printable-area { 
                position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; transform: scale(1) !important; padding: 0; margin: 0; 
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div id="nav-container"></div>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-6xl">
        <div id="search-section" class="no-print">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-black text-slate-900 mb-2 tracking-tighter">Academic <span class="text-blue-600">Portal</span></h1>
                <p class="text-slate-500 text-sm font-medium">Instantly access and print your mark report card.</p>
            </div>
            <div class="max-w-md mx-auto bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <select id="year-select" class="w-full p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 ring-blue-500"></select>
                    <select id="class-select" class="w-full p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 ring-blue-500"></select>
                </div>
                <select id="exam-select" class="w-full p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 ring-blue-500"></select>
                <input type="text" id="roll-input" placeholder="Enter Roll Number" class="w-full p-4 bg-slate-50 border rounded-xl font-bold text-sm outline-none focus:ring-2 ring-blue-500">
                <button id="search-btn" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black flex items-center justify-center gap-2 hover:bg-blue-600 transition-all active:scale-95 shadow-lg">
                    <i data-lucide="search" class="w-5 h-5"></i> FETCH REPORT
                </button>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-4">
            <div class="flex justify-between items-center no-print px-2">
                <button onclick="location.reload()" class="text-slate-500 font-bold text-[10px] uppercase flex items-center gap-1 bg-white px-4 py-2 rounded-full shadow-sm"><i data-lucide="arrow-left" class="w-3 h-3"></i> BACK</button>
                <button onclick="window.print()" class="bg-green-600 text-white px-6 py-2 rounded-full font-black text-[10px] uppercase flex items-center gap-2 shadow-lg hover:bg-green-700 transition-all"><i data-lucide="printer" class="w-4 h-4"></i> PRINT PDF</button>
            </div>
            <div id="printable-area"></div>
        </div>
    </main>

    <script type="module">
        import { auth, db, collection, getDocs, doc, getDoc, onAuthStateChanged, signOut } from './firebase-config.js';
        import { renderNavbar, renderMarksheet } from './components.js';

        onAuthStateChanged(auth, user => {
            const nav = renderNavbar(user);
            document.getElementById('nav-container').innerHTML = '';
            document.getElementById('nav-container').appendChild(nav);
            lucide.createIcons();
            if(user) document.getElementById('nav-logout-btn').onclick = () => signOut(auth).then(() => location.reload());
        });

        const yS = document.getElementById('year-select'), cS = document.getElementById('class-select'), eS = document.getElementById('exam-select');
        getDocs(collection(db, "results")).then(snap => {
            const ySet = new Set(), cSet = new Set(), eSet = new Set();
            snap.forEach(d => { const data = d.data(); ySet.add(data.year); cSet.add(data.className); eSet.add(data.examName); });
            yS.innerHTML = '<option value="">Year</option>' + [...ySet].sort().reverse().map(i => `<option value="${i}">${i}</option>`).join('');
            cS.innerHTML = '<option value="">Class</option>' + [...cSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
            eS.innerHTML = '<option value="">Exam</option>' + [...eSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
        });

        document.getElementById('search-btn').onclick = async () => {
            const y = yS.value, c = cS.value, e = eS.value, roll = document.getElementById('roll-input').value;
            if(!y || !c || !e || !roll) return alert("Fill all fields");

            const snap = await getDoc(doc(db, "results", `${y}_${c}_${e}`));
            if(snap.exists()) {
                const results = snap.data();
                const found = results.data.find(r => String(r['Roll No'] || r['ID'] || r['Roll']).toLowerCase() === roll.toLowerCase());
                if(found) {
                    document.getElementById('search-section').classList.add('hidden');
                    document.getElementById('result-view').classList.remove('hidden');
                    document.getElementById('printable-area').innerHTML = renderMarksheet(found, results);
                    lucide.createIcons();
                } else alert("Roll not found!");
            } else alert("Result not found!");
        };
    </script>
</body>
</html>
