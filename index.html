<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduResult - Academic Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); }
        
        @media print {
            @page { size: A4; margin: 0; }
            body { margin: 0; padding: 0; background: white !important; }
            .no-print { display: none !important; }
            #printable-area { 
                display: block !important; 
                width: 210mm; 
                height: 297mm; 
                padding: 10mm;
                margin: 0 auto;
                box-sizing: border-box;
            }
            .a4-container { 
                width: 100% !important; 
                height: 100% !important; 
                border: 4px double #000 !important;
                padding: 20px !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                page-break-after: avoid;
            }
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="nav-container"></div>
    <main class="container mx-auto px-4 py-12 max-w-6xl">
        <div id="search-section" class="no-print">
            <div class="text-center mb-12">
                <h1 class="text-5xl font-black text-slate-900 mb-4 tracking-tight">Academic <span class="text-blue-600">Portal</span></h1>
                <p class="text-slate-500 font-medium">নিচে আপনার তথ্য প্রদান করে একাডেমিক ট্রান্সক্রিপ্ট সংগ্রহ করুন।</p>
            </div>
            <div class="max-w-xl mx-auto glass-card p-10 rounded-[2.5rem] shadow-2xl space-y-6 border-slate-200">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Academic Year</label>
                        <select id="year-select" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold text-sm"></select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Class</label>
                        <select id="class-select" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold text-sm"></select>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Examination Category</label>
                    <select id="exam-select" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold text-sm"></select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">Roll Number</label>
                    <input type="text" id="roll-input" placeholder="e.g. 101" class="w-full p-4 bg-white border border-slate-200 rounded-2xl outline-none font-bold">
                </div>
                <button id="search-btn" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black hover:bg-slate-800 transition-all flex items-center justify-center gap-3">
                    <i data-lucide="file-search" class="w-5 h-5"></i> FETCH RESULT
                </button>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-8">
            <div class="flex justify-between items-center no-print">
                <button onclick="location.reload()" class="font-black text-xs uppercase tracking-widest flex items-center gap-2"><i data-lucide="arrow-left"></i> Back</button>
                <button onclick="window.print()" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-black text-xs flex items-center gap-2"><i data-lucide="printer"></i> PRINT MARKSHEET</button>
            </div>
            <div id="printable-area"></div>
        </div>
    </main>

    <script type="module">
        import { auth, db, collection, getDocs, doc, getDoc, onAuthStateChanged } from './firebase-config.js';
        import { renderNavbar, renderMarksheet } from './components.js';

        onAuthStateChanged(auth, user => {
            document.getElementById('nav-container').innerHTML = '';
            document.getElementById('nav-container').appendChild(renderNavbar(user));
            lucide.createIcons();
        });

        const years = new Set(), classes = new Set(), exams = new Set();
        getDocs(collection(db, "results")).then(snap => {
            snap.forEach(d => {
                const data = d.data();
                years.add(data.year); classes.add(data.className); exams.add(data.examName);
            });
            populate('year-select', [...years]);
            populate('class-select', [...classes]);
            populate('exam-select', [...exams]);
        });

        const populate = (id, list) => {
            document.getElementById(id).innerHTML = '<option value="">Select</option>' + list.map(i => `<option value="${i}">${i}</option>`).join('');
        };

        document.getElementById('search-btn').onclick = async () => {
            const y = document.getElementById('year-select').value, c = document.getElementById('class-select').value, e = document.getElementById('exam-select').value, roll = document.getElementById('roll-input').value;
            if(!y || !c || !e || !roll) return alert("সব তথ্য পূরণ করুন।");

            const snap = await getDoc(doc(db, "results", `${y}_${c}_${e}`));
            if(snap.exists()) {
                const res = snap.data();
                const student = res.data.find(r => String(r['Roll'] || r['Roll No'] || r['ID'] || '').trim() === String(roll).trim());
                if(student) {
                    document.getElementById('search-section').classList.add('hidden');
                    document.getElementById('result-view').classList.remove('hidden');
                    document.getElementById('printable-area').innerHTML = renderMarksheet(student, res);
                    lucide.createIcons();
                } else alert("রোল নম্বর খুঁজে পাওয়া যায়নি।");
            } else alert("রেজাল্ট এখনো প্রকাশিত হয়নি।");
        };
    </script>
</body>
</html>
