<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Result Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #f0f2f5; margin: 0; }
        
        /* মোবাইল ভিউতে কার্ড ইফেক্ট রিমুভ করে ক্লিন লুক */
        #printable-area { width: 100%; display: flex; justify-content: center; padding: 0; }

        @media print {
            @page { size: A4; margin: 10mm; }
            body { background: white !important; }
            .no-print { display: none !important; }
            #printable-area { width: 100%; padding: 0; margin: 0; display: block; }
            .a4-wrapper { 
                box-shadow: none !important; 
                border: none !important; 
                width: 100% !important;
                padding: 0 !important;
            }
            /* ১ পেজে রাখার জন্য ছোট স্কেলিং */
            html, body { height: auto; font-size: 12pt; }
        }

        .a4-wrapper {
            width: 100%;
            max-width: 210mm;
            min-height: 297mm;
            background: white;
            padding: 40px;
            box-sizing: border-box;
            position: relative;
        }

        @media (max-width: 640px) {
            .a4-wrapper { padding: 20px; }
        }

        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #000; padding: 8px 12px; text-align: left; }
        th { background: #f8fafc; font-weight: bold; text-transform: uppercase; font-size: 12px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-slate-900 text-white p-4 no-print shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <span class="font-black text-xl tracking-tighter uppercase">EduResult</span>
            <div class="text-[10px] font-bold opacity-70">OFFICIAL PORTAL</div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        <div id="search-section" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl no-print border border-slate-100">
            <h2 class="text-2xl font-black mb-6 text-center text-slate-800 uppercase italic">Find Result</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <select id="year-select" class="w-full p-3 bg-slate-50 border rounded-lg font-bold text-sm outline-none"></select>
                    <select id="class-select" class="w-full p-3 bg-slate-50 border rounded-lg font-bold text-sm outline-none"></select>
                </div>
                <select id="exam-select" class="w-full p-3 bg-slate-50 border rounded-lg font-bold text-sm outline-none"></select>
                <input type="text" id="roll-input" placeholder="Student Roll / ID" class="w-full p-3 bg-slate-50 border rounded-lg font-bold text-sm outline-none">
                <button id="search-btn" class="w-full bg-blue-600 text-white py-4 rounded-lg font-black hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="search" class="w-5 h-5"></i> GET RESULT
                </button>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-4">
            <div class="flex flex-wrap justify-between items-center no-print max-w-[210mm] mx-auto gap-4">
                <button onclick="location.reload()" class="flex items-center gap-2 text-slate-500 font-bold text-xs uppercase"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back</button>
                <button onclick="window.print()" class="bg-green-600 text-white px-8 py-3 rounded-full font-black text-xs uppercase shadow-xl flex items-center gap-2 transition-transform active:scale-95"><i data-lucide="printer" class="w-4 h-4"></i> Print Result</button>
            </div>
            <div id="printable-area"></div>
        </div>
    </main>

    <script type="module">
        import { db, collection, getDocs, doc, getDoc } from './firebase-config.js';
        import { renderMarksheet } from './components.js';

        const yS = document.getElementById('year-select'), cS = document.getElementById('class-select'), eS = document.getElementById('exam-select');
        getDocs(collection(db, "results")).then(snap => {
            const ySet = new Set(), cSet = new Set(), eSet = new Set();
            snap.forEach(d => { const data = d.data(); ySet.add(data.year); cSet.add(data.className); eSet.add(data.examName); });
            yS.innerHTML = '<option value="">Year</option>' + [...ySet].sort().reverse().map(i => `<option value="${i}">${i}</option>`).join('');
            cS.innerHTML = '<option value="">Class</option>' + [...cSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
            eS.innerHTML = '<option value="">Exam</option>' + [...eSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
        });

        document.getElementById('search-btn').onclick = async () => {
            const y = yS.value, c = cS.value, e = eS.value, roll = document.getElementById('roll-input').value;
            if(!y || !c || !e || !roll) return alert("Fill all fields");

            const snap = await getDoc(doc(db, "results", `${y}_${c}_${e}`));
            if(snap.exists()) {
                const results = snap.data();
                const found = results.data.find(r => String(r['Roll No'] || r['Roll'] || r['ID']).toLowerCase() === roll.toLowerCase());
                if(found) {
                    document.getElementById('search-section').classList.add('hidden');
                    document.getElementById('result-view').classList.remove('hidden');
                    document.getElementById('printable-area').innerHTML = renderMarksheet(found, results);
                    lucide.createIcons();
                } else alert("Roll not found!");
            } else alert("No data found!");
        };
    </script>
</body>
</html>
