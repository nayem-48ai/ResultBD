<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Academic Result Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; overflow-x: hidden; }
        
        #printable-area { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            padding: 20px 10px;
        }

        .a4-container {
            width: 99%;
            max-width: 800px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }

        @media (max-width: 640px) {
            .a4-container { border-width: 2px !important; border-radius: 8px; }
        }

        @media print {
            @page { size: A4; margin: 0; }
            body { background: white !important; margin: 0 !important; padding: 0 !important; }
            body * { visibility: hidden !important; }
            #printable-area, #printable-area * { visibility: visible !important; }
            #printable-area { 
                position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; padding: 0; margin: 0; 
            }
            .a4-container {
                width: 210mm !important; height: 297mm !important;
                border: 6px double #000 !important; /* আগের সেই পারফেক্ট বর্ডার */
                box-shadow: none !important;
                border-radius: 0 !important;
            }
            .no-print { display: none !important; }
            /* প্রিন্টে কালার যাতে ধূসর না হয় তার জন্য ফোর্স ব্ল্যাক */
            .print-force-dark { background-color: #000 !important; color: #fff !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-white border-b no-print py-4 shadow-sm">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-2 font-black text-2xl tracking-tighter text-slate-800">
                <div class="bg-blue-600 p-1.5 rounded-lg text-white"><i data-lucide="graduation-cap"></i></div>
                EduResult
            </div>
            <div class="text-slate-400 font-bold text-xs uppercase tracking-widest">Public Portal</div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        <div id="search-section" class="no-print">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-black text-slate-900 mb-2">Academic <span class="text-blue-600">Portal</span></h1>
                <p class="text-slate-500">Hat Madhnogor High School Result System</p>
            </div>
            <div class="max-w-md mx-auto bg-white p-8 rounded-[2rem] shadow-xl space-y-4 border border-slate-100">
                <div class="grid grid-cols-2 gap-4">
                    <select id="year-select" class="w-full p-4 bg-slate-50 border rounded-xl font-bold outline-none"></select>
                    <select id="class-select" class="w-full p-4 bg-slate-50 border rounded-xl font-bold outline-none"></select>
                </div>
                <select id="exam-select" class="w-full p-4 bg-slate-50 border rounded-xl font-bold outline-none"></select>
                <input type="text" id="roll-input" placeholder="Roll Number" class="w-full p-4 bg-slate-50 border rounded-xl font-bold outline-none">
                <button id="search-btn" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="search" class="w-5 h-5"></i> VIEW MARKSHEET
                </button>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-4">
            <div class="flex justify-between items-center no-print max-w-[800px] mx-auto">
                <button onclick="location.reload()" class="text-slate-500 font-bold text-xs uppercase flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> BACK</button>
                <button onclick="window.print()" class="bg-green-600 text-white px-6 py-2.5 rounded-xl font-black text-xs flex items-center gap-2 shadow-lg"><i data-lucide="printer" class="w-4 h-4"></i> PRINT A4 COPY</button>
            </div>
            <div id="printable-area"></div>
        </div>
    </main>

    <script type="module">
        import { db, collection, getDocs, doc, getDoc } from './firebase-config.js';
        import { renderMarksheet } from './components.js';

        lucide.createIcons();
        const yS = document.getElementById('year-select'), cS = document.getElementById('class-select'), eS = document.getElementById('exam-select');

        getDocs(collection(db, "results")).then(snap => {
            const ySet = new Set(), cSet = new Set(), eSet = new Set();
            snap.forEach(d => { const data = d.data(); ySet.add(data.year); cSet.add(data.className); eSet.add(data.examName); });
            yS.innerHTML = '<option value="">Year</option>' + [...ySet].sort().reverse().map(i => `<option value="${i}">${i}</option>`).join('');
            cS.innerHTML = '<option value="">Class</option>' + [...cSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
            eS.innerHTML = '<option value="">Exam</option>' + [...eSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
        });

        document.getElementById('search-btn').onclick = async () => {
            const y = yS.value, c = cS.value, e = eS.value, roll = document.getElementById('roll-input').value;
            if(!y || !c || !e || !roll) return alert("Fill all fields");

            const snap = await getDoc(doc(db, "results", `${y}_${c}_${e}`));
            if(snap.exists()) {
                const results = snap.data();
                const found = results.data.find(r => String(r['Roll No'] || r['Roll'] || r['ID']).trim().toLowerCase() === roll.trim().toLowerCase());
                if(found) {
                    document.getElementById('search-section').classList.add('hidden');
                    document.getElementById('result-view').classList.remove('hidden');
                    document.getElementById('printable-area').innerHTML = renderMarksheet(found, results);
                    lucide.createIcons();
                } else alert("Roll not found!");
            } else alert("Data not found!");
        };
    </script>
</body>
</html>
