<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduResult - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; overflow-x: hidden; }
        
        /* Web View: এক স্ক্রিনে রিপোর্ট দেখানোর জন্য ম্যাজিক */
        #printable-area { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            padding: 10px;
        }

        .a4-container {
            aspect-ratio: 1 / 1.414; /* A4 Ratio */
            width: 100%;
            max-width: 800px; /* ডেস্কটপের জন্য */
            background: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        /* মোবাইলে যাতে স্ক্রল ছাড়া দেখা যায় */
        @media (max-width: 640px) {
            .a4-container {
                max-width: 100%;
                padding: 15px !important;
                border-width: 3px !important;
                border-radius: 12px !important;
            }
            main { padding-top: 1rem !important; }
        }

        @media print {
            @page { size: A4; margin: 0; }
            body { background: white !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; }
            body * { visibility: hidden !important; }
            #printable-area, #printable-area * { visibility: visible !important; }
            #printable-area { 
                position: absolute; left: 0; top: 0; width: 210mm; height: 297mm; padding: 0; margin: 0; 
            }
            .a4-container {
                width: 210mm !important; height: 297mm !important;
                border-radius: 0 !important; box-shadow: none !important;
                border: 6px double #000 !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div id="nav-container"></div>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-6xl">
        <div id="search-section" class="no-print">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-black text-slate-900 mb-2">Academic <span class="text-blue-600">Portal</span></h1>
                <p class="text-slate-500 text-sm">Download your digital transcript instantly.</p>
            </div>
            <div class="max-w-md mx-auto bg-white p-8 rounded-[2rem] shadow-xl space-y-5 border border-slate-100">
                <div class="grid grid-cols-2 gap-4">
                    <select id="year-select" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold"></select>
                    <select id="class-select" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold"></select>
                </div>
                <select id="exam-select" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold"></select>
                <input type="text" id="roll-input" placeholder="Roll Number" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl font-bold">
                <button id="search-btn" class="w-full bg-slate-900 text-white py-4 rounded-xl font-black flex items-center justify-center gap-2 hover:bg-blue-600 transition-all">
                    <i data-lucide="search" class="w-5 h-5"></i> FETCH RESULT
                </button>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-4">
            <div class="flex justify-between items-center no-print">
                <button onclick="location.reload()" class="text-slate-500 font-bold text-xs uppercase flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> BACK</button>
                <button onclick="window.print()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-black text-xs flex items-center gap-2"><i data-lucide="printer" class="w-4 h-4"></i> PRINT PDF</button>
            </div>
            <div id="printable-area"></div>
        </div>
    </main>

    <script type="module">
        import { auth, db, collection, getDocs, doc, getDoc, onAuthStateChanged, signOut } from './firebase-config.js';
        import { renderNavbar, renderMarksheet } from './components.js';

        onAuthStateChanged(auth, user => {
            document.getElementById('nav-container').innerHTML = '';
            document.getElementById('nav-container').appendChild(renderNavbar(user));
            lucide.createIcons();
            if(user) document.getElementById('nav-logout-btn').onclick = () => signOut(auth).then(() => location.reload());
        });

        const yS = document.getElementById('year-select'), cS = document.getElementById('class-select'), eS = document.getElementById('exam-select');
        getDocs(collection(db, "results")).then(snap => {
            const ySet = new Set(), cSet = new Set(), eSet = new Set();
            snap.forEach(d => { const data = d.data(); ySet.add(data.year); cSet.add(data.className); eSet.add(data.examName); });
            yS.innerHTML = '<option value="">Year</option>' + [...ySet].sort().reverse().map(i => `<option value="${i}">${i}</option>`).join('');
            cS.innerHTML = '<option value="">Class</option>' + [...cSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
            eS.innerHTML = '<option value="">Exam</option>' + [...eSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
        });

        document.getElementById('search-btn').onclick = async () => {
            const y = yS.value, c = cS.value, e = eS.value, roll = document.getElementById('roll-input').value;
            if(!y || !c || !e || !roll) return alert("All fields are required!");

            const snap = await getDoc(doc(db, "results", `${y}_${c}_${e}`));
            if(snap.exists()) {
                const results = snap.data();
                const found = results.data.find(r => String(r['Roll No'] || r['ID'] || r['Roll']).toLowerCase() === roll.toLowerCase());
                if(found) {
                    document.getElementById('search-section').classList.add('hidden');
                    document.getElementById('result-view').classList.remove('hidden');
                    document.getElementById('printable-area').innerHTML = renderMarksheet(found, results);
                    lucide.createIcons();
                } else alert("Roll not found!");
            } else alert("Dataset not available!");
        };
    </script>
</body>
</html>
