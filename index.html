<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Result Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #1e293b; }
        
        .result-sheet {
            background: white;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 30px; /* ওয়েব ভিউতে একটু প্যাডিং */
        }

        @media print {
            @page { size: A4; margin: 5mm; } /* মার্জিন একদম কমিয়ে ৫মিমি করা হলো */
            html, body { height: 99%; } /* এক পেজ নিশ্চিত করতে */
            body { background: white !important; margin: 0 !important; }
            .no-print { display: none !important; }
            .result-sheet { 
                padding: 15px !important; /* প্রিন্টে প্যাডিং কমানো হলো */
                width: 100% !important;
                max-width: 100% !important;
                box-shadow: none !important;
                border: none !important;
            }
            .print-bg-dark { background-color: #000 !important; color: #fff !important; -webkit-print-color-adjust: exact; }
        }

        @media (max-width: 640px) {
            .result-sheet { padding: 15px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-white border-b no-print py-3 shadow-sm">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center gap-2 font-extrabold text-xl tracking-tighter">
                <div class="bg-blue-600 p-1.5 rounded text-white"><i data-lucide="graduation-cap"></i></div>
                EduResult
            </div>
            <div class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Institutional Portal</div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-6">
        <div id="search-section" class="no-print max-w-md mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-2xl font-black mb-6 text-center">Search Result</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <select id="year-select" class="w-full p-3 bg-slate-50 border rounded-lg font-semibold outline-none"></select>
                    <select id="class-select" class="w-full p-3 bg-slate-50 border rounded-lg font-semibold outline-none"></select>
                </div>
                <select id="exam-select" class="w-full p-3 bg-slate-50 border rounded-lg font-semibold outline-none"></select>
                <input type="text" id="roll-input" placeholder="Enter Roll Number" class="w-full p-3 bg-slate-50 border rounded-lg font-semibold">
                <button id="search-btn" class="w-full bg-slate-900 text-white py-3 rounded-lg font-bold hover:bg-blue-700 flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="search" class="w-4 h-4"></i> FETCH DATA
                </button>
            </div>
        </div>

        <div id="result-view" class="hidden space-y-4">
            <div class="flex justify-between items-center no-print max-w-[850px] mx-auto px-2">
                <button onclick="location.reload()" class="text-slate-500 font-bold text-xs uppercase flex items-center gap-1"><i data-lucide="chevron-left" class="w-4 h-4"></i> Back</button>
                <button onclick="window.print()" class="bg-green-600 text-white px-5 py-2 rounded-lg font-bold text-xs flex items-center gap-2 shadow-md"><i data-lucide="printer" class="w-4 h-4"></i> PRINT RESULT</button>
            </div>
            <div id="printable-area"></div>
        </div>
    </main>

    <script type="module">
        import { db, collection, getDocs, doc, getDoc } from './firebase-config.js';
        import { renderMarksheet } from './components.js';

        lucide.createIcons();
        const yS = document.getElementById('year-select'), cS = document.getElementById('class-select'), eS = document.getElementById('exam-select');

        getDocs(collection(db, "results")).then(snap => {
            const ySet = new Set(), cSet = new Set(), eSet = new Set();
            snap.forEach(d => { const data = d.data(); ySet.add(data.year); cSet.add(data.className); eSet.add(data.examName); });
            yS.innerHTML = '<option value="">Year</option>' + [...ySet].sort().reverse().map(i => `<option value="${i}">${i}</option>`).join('');
            cS.innerHTML = '<option value="">Class</option>' + [...cSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
            eS.innerHTML = '<option value="">Exam</option>' + [...eSet].sort().map(i => `<option value="${i}">${i}</option>`).join('');
        });

        document.getElementById('search-btn').onclick = async () => {
            const roll = document.getElementById('roll-input').value;
            const docId = `${yS.value}_${cS.value}_${eS.value}`;
            if(!yS.value || !roll) return alert("Please select all fields");

            const snap = await getDoc(doc(db, "results", docId));
            if(snap.exists()) {
                const results = snap.data();
                const found = results.data.find(r => String(r['Roll No'] || r['Roll'] || r['ID']).trim().toLowerCase() === roll.trim().toLowerCase());
                if(found) {
                    document.getElementById('search-section').classList.add('hidden');
                    document.getElementById('result-view').classList.remove('hidden');
                    document.getElementById('printable-area').innerHTML = renderMarksheet(found, results);
                    lucide.createIcons();
                } else alert("Roll not found!");
            } else alert("No data available!");
        };
    </script>
</body>
</html>
